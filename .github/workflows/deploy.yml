name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pull the latest release installers onto OUR domain (stable names,
      # version stripped) so /download links to www.universaltill.com/…
      # and shop owners never touch GitHub. Non-fatal if a release is
      # missing (the download page still ships).
      - name: Stage release installers + write latest.json manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site/downloads
          VER=$(gh release view --repo universaltill/universal-till --json tagName --jq '.tagName' 2>/dev/null | sed 's/^v//')
          if [ -n "$VER" ] && gh release download "v$VER" --repo universaltill/universal-till --pattern 'unitill-pos_*' --dir /tmp/rel 2>/dev/null; then
            for f in /tmp/rel/unitill-pos_*; do
              stable=$(basename "$f" | sed -E 's/_[0-9]+\.[0-9]+\.[0-9]+_/_/')
              cp "$f" "site/downloads/$stable"
            done
            # Manifest the /download page reads at runtime — version + our-domain URLs.
            cat > site/downloads/latest.json <<JSON
          {
            "version": "$VER",
            "released": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "downloads": {
              "windows_amd64": "/downloads/unitill-pos_windows_amd64.zip",
              "darwin_arm64":  "/downloads/unitill-pos_darwin_arm64.tar.gz",
              "linux_arm64_deb": "/downloads/unitill-pos_linux_arm64.deb",
              "linux_arm64_tar": "/downloads/unitill-pos_linux_arm64.tar.gz",
              "linux_amd64_deb": "/downloads/unitill-pos_linux_amd64.deb",
              "linux_amd64_tar": "/downloads/unitill-pos_linux_amd64.tar.gz",
              "android": "/downloads/unitill-pos_android.apk"
            }
          }
          JSON
            echo "staged installers for v$VER"; ls -la site/downloads/
          else
            echo '{"version":null}' > site/downloads/latest.json
            echo "no release assets found — download page ships, manifest empty"
          fi
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          skip_app_build: true
