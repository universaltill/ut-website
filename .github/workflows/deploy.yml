name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pull the latest release installers onto OUR domain (stable names,
      # version stripped) so /download links to www.universaltill.com/…
      # and shop owners never touch GitHub. Non-fatal if a release is
      # missing (the download page still ships).
      - name: Stage release installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site/downloads
          if gh release download --repo universaltill/universal-till --pattern 'unitill-pos_*' --dir /tmp/rel 2>/dev/null; then
            for f in /tmp/rel/unitill-pos_*; do
              base=$(basename "$f")
              # strip the version: unitill-pos_0.1.0_linux_arm64.deb -> unitill-pos_linux_arm64.deb
              stable=$(echo "$base" | sed -E 's/_[0-9]+\.[0-9]+\.[0-9]+_/_/')
              cp "$f" "site/downloads/$stable"
            done
            ls -la site/downloads/
          else
            echo "no release assets found — shipping download page without installers"
          fi
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          skip_app_build: true
