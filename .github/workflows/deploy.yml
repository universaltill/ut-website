name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:
  # ut-docs#1503: the /downloads redirects below are written at DEPLOY time
  # (pinned to that release's versioned assets), so /downloads froze at whatever release was newest the last time this site
  # happened to ship. On 2026-09-03 that meant the site served v0.9.1 while
  # v0.9.3 was out — and because v0.9.1 predates the ADR-0074 schema reset,
  # a shop installing from the website got a database the next update
  # refuses to migrate. A product release cannot push to this repo without
  # handing another repo's workflow a write token, so the site pulls
  # instead: check hourly, redeploy only when actually behind.
  schedule:
    - cron: "17 * * * *"

jobs:
  # Cheap gate for the scheduled run: is the release the site's download links point at
  # behind the newest product release? Every other trigger deploys
  # unconditionally, exactly as before.
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.stale.outputs.should_deploy }}
    steps:
      - id: stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "trigger ${{ github.event_name }} — deploying unconditionally" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          LATEST=$(gh release view --repo universaltill/universal-till --json tagName --jq '.tagName' | sed 's/^v//')
          LIVE=$(curl -fsS --max-time 20 https://universaltill.com/downloads/latest.json | jq -r '.version // "none"')
          echo "newest release: ${LATEST:-unknown} · site links point at: ${LIVE}" >> "$GITHUB_STEP_SUMMARY"
          # Fail closed on an unreadable release: a missing answer must not
          # look like "up to date" and silently stop refreshing the site.
          if [ -z "${LATEST}" ]; then
            echo "::error::could not read the newest release — refusing to conclude the site is current"
            exit 1
          fi
          if [ "$LIVE" = "$LATEST" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "site is current — nothing to do" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "::notice::site serves ${LIVE}, newest release is ${LATEST} — redeploying (ut-docs#1503)"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installers are served straight from GitHub releases (ut-docs#2489):
      # every /downloads/<stable-name> path becomes a 302 to the versioned
      # release asset (GitHub sends it as an attachment, so a click starts the
      # download) and latest.json lists the same URLs. Nothing is copied onto
      # the site — mirroring them outgrew the 250MB SWA cap (ut-docs#2486).
      # Non-fatal if a release is missing (the download page still ships).
      - name: Write download redirects + latest.json manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site/downloads
          VER=$(gh release view --repo universaltill/universal-till --json tagName --jq '.tagName' 2>/dev/null | sed 's/^v//')
          if [ -n "$VER" ] && gh release view "v$VER" --repo universaltill/universal-till --json assets --jq '.assets[].name' > /tmp/assets.txt 2>/dev/null; then
            bash scripts/download-redirects.sh "$VER" /tmp/assets.txt site
          else
            echo '{"version":null}' > site/downloads/latest.json
            echo "no release found — download page ships, manifest empty"
          fi
      # Re-validate the SWA config AFTER download-redirects.sh added its
      # redirect routes (ut-docs#2489) — CI only checks the committed copy.
      - name: Validate the deployed SWA config
        run: node scripts/check-swa-config.js
      - uses: actions/setup-node@v4
        with:
          # Astro 7 requires >=22.12.0 and hard-exits below it. Build toolchain
          # only; nothing on this site runs Node at request time now that the
          # api/ functions have gone (see api_location below).
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build (Astro — site/ is publicDir, copied through unchanged)
        run: npm run build
      # Fail here, with the reason, rather than at Azure's opaque BadRequest
      # (ut-docs#2486): the free SWA plan rejects content over 262144000 bytes.
      - name: Check deploy size against the SWA cap
        run: |
          bytes=$(du -sb dist | cut -f1)
          echo "dist is $bytes bytes (cap 262144000)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -gt 250000000 ]; then
            echo "::error::dist is $bytes bytes — over the Static Web Apps cap; something large is being staged into dist"
            du -sh dist/* | sort -h | tail -5; exit 1
          fi
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          # Point app_location straight at the built output, mirroring the
          # proven pre-Astro config (app_location: site + skip_app_build)
          # rather than relying on output_location being honoured while the
          # build is skipped — that combination is ambiguous in this action,
          # and if output_location were ignored it would upload the repo
          # ROOT: node_modules/ (hundreds of MB, present because npm ci just
          # ran) plus src/ and .git. This repo has already had a deploy
          # rejected at the 250 MB free-tier limit — see the note at the top
          # of this file about deploy 30313779077.
          app_location: "dist"
          # No api_location: this site ships no managed functions. The Decap
          # OAuth relay it used to carry moved into the ut-admin pod on the
          # homelab cluster (ut-docs#468) — it has to be same-origin with the
          # CMS, and the CMS is no longer here.
          skip_app_build: true # built explicitly above, not via Oryx auto-detect
