server {
  # LOOPBACK ONLY. oauth2-proxy reaches it over 127.0.0.1 from the same pod
  # (homelab) or the same Container Apps replica (Azure). On the homelab, pod
  # IPs are directly routable across the k3s/flannel cluster, so binding
  # 0.0.0.0 would let any pod — including an Actions Runner Controller pod
  # running CI code from a PR — fetch this page with no authentication; on
  # Azure the same holds for any neighbour in the environment's VNet.
  listen       127.0.0.1:8080;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz {
    access_log off;
    # default_type, NOT add_header: nginx's add_header inheritance is
    # all-or-nothing per level, so declaring one here would drop the three
    # security headers above for this location.
    default_type text/plain;
    return 200 'ok';
  }

  # What is deployed, for the ut-docs#2603 verification and monitoring.
  # It names the pinned Decap release; cms/tests/web.test.js fails if this
  # drifts from the <script src> in index.html. (The image itself is
  # identified by its digest, pinned where it is deployed.) Readable without a session (oauth2-proxy
  # --skip-auth-route), unlike the page itself, which sits behind the
  # login: an accepted, deliberate disclosure of the pinned Decap
  # version (ut-docs#2603 review) so the verification step can check it
  # without a session.
  location = /version {
    access_log off;
    default_type application/json;
    return 200 '{"app":"ut-cms","decap":"3.15.1"}';
  }

  # The Decap <-> GitHub OAuth relay (ut-docs#468), same-origin by
  # necessity — see cms/relay/relay.js. Prefix match, so /api/auth and
  # /api/callback both land here; proxy_pass without a URI part passes the
  # request path through unchanged.
  #
  # It is a separate process rather than more nginx config because it has
  # to hold a client secret and do a server-to-server token exchange. It
  # inherits the three security headers above (this location declares no
  # add_header of its own, and nginx's add_header inheritance is
  # all-or-nothing per level).
  location /api/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    # The relay pins its own origin from SITE_ORIGIN and reads no host
    # header, so nothing here is load-bearing for correctness — but leaving
    # nginx's default "Host: 127.0.0.1:8081" in place would make any future
    # host-dependent logic quietly wrong.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    # Deliberately NOT `try_files $uri $uri/ /index.html`. That is exactly
    # the Azure SWA navigationFallback behaviour this project has been
    # bitten by repeatedly — every unknown path answers 200 with the page,
    # so "does this exist?" looks answered when it is not, and a
    # verification like `curl … | grep decap-cms` passes for ANY path.
    # This is a single page; an unknown path should say so. It also means a
    # mistyped relay path 404s rather than handing Decap's OAuth popup the
    # admin page and a hang — which is exactly how the missing relay
    # announced itself (ut-docs#468).
    #
    # `$uri/` is load-bearing and NOT the SPA fallback: without it, "/"
    # resolves to a DIRECTORY, `try_files $uri =404` finds no file of that
    # name, and the site's own root 404s — the index directive never gets
    # a chance to serve index.html. `$uri/` lets the index module resolve
    # "/" while an unknown path still ends at =404. (Caught live: the first
    # deploy of this config returned 404 for "/" itself.)
    try_files $uri $uri/ =404;
  }
}
