# Top-level nginx config for the ut-cms-web image. Written for a read-only
# root filesystem: the pid file and every temp path live under /tmp.
# One worker: an owner-only CMS page in a 0.1 vCPU container.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout combined;

    # No version in the Server header or on error pages.
    server_tokens off;

    sendfile on;
    keepalive_timeout 65;
    # Nothing here accepts an upload: the page is static and the relay's two
    # endpoints are GETs. Decap commits straight to the GitHub API.
    client_max_body_size 1k;

    include /etc/nginx/conf.d/*.conf;
}
