<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universal Till — Admin</title>

  <!-- Decap CMS 2.0+ is CSS-in-JS (styles are injected by decap-cms.js
       itself); there is no dist/decap-cms.css to link -- the package only
       ships a vestigial, effectively-empty dist/cms.css compat shim.
       See ut-docs#354. -->
</head>
<body>
  <script id="decap-cms-config" type="application/json">
    {
      "backend": {
        "name": "github",
        "repo": "universaltill/ut-website",
        "branch": "main",
        "base_url": "https://www.universaltill.com",
        "auth_endpoint": "api/auth"
      },
      "load_config_file": false,
      "publish_mode": "editorial_workflow",
      "site_url": "https://www.universaltill.com",
      "display_url": "https://www.universaltill.com",
      "logo_url": "/logo.svg",
      "show_preview_links": false,
      "issue_reports": {
        "url": "https://github.com/universaltill/ut-website/issues/new"
      },
      "media_folder": "site/images",
      "public_folder": "/images",
      "collections": [
        {
          "name": "blog",
          "label": "Blog Posts",
          "folder": "src/content/blog/",
          "create": true,
          "slug": "{{slug}}",
          "extension": "mdx",
          "format": "frontmatter",
          "fields": [
            { "name": "title", "label": "Title" },
            { "name": "date", "label": "Date", "widget": "datetime" },
            { "name": "excerpt", "label": "Excerpt", "widget": "text" },
            { "name": "author", "label": "Author", "widget": "string", "default": "Universal Till" },
            { "name": "coverImage", "label": "Cover Image", "widget": "image", "required": false },
            { "name": "draft", "label": "Draft", "widget": "boolean", "default": false, "required": false },
            { "name": "body", "label": "Content", "widget": "markdown" }
          ]
        }
      ]
    }
  </script>

  <script>
    window.CMS_MANUAL_INIT = true;
  </script>
  <!-- Pinned to an exact release with Subresource Integrity: the previous
       "@^3.0.0" floating range let any new 3.x publish (unpkg, npm, or a
       compromise of either) execute unreviewed on this origin, which holds
       a GitHub token in localStorage. Bump deliberately -- update the
       version AND the integrity hash together, never one without the
       other. Caveat: this covers only the entry file -- decap-cms.js
       webpack-splits into ~90 dynamically loaded chunks fetched from the
       same pinned/immutable npm-published version with no per-chunk SRI,
       so a compromised CDN edge could still tamper with a chunk response
       in flight (mitigated by npm tarball immutability, not eliminated).
       See ut-docs#354. -->
  <script
    src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"
    integrity="sha384-in6eHztHveqQ7uMZ1fDaKlDmacQLFuLH2wWrFTiymyuS8zQ5bixwL8U3AeRi8h/L"
    crossorigin="anonymous"
  ></script>
  <script>
    const config = JSON.parse(document.getElementById('decap-cms-config').textContent);
    const CMS = window.CMS;
    const initCMS = window.initCMS;

    if (!CMS || !initCMS) {
      document.body.innerHTML =
        '<main style="font-family:system-ui,sans-serif;padding:2rem;max-width:48rem;margin:0 auto;"><h1>CMS failed to load</h1><p>The Decap CMS script did not initialise correctly. Check browser console and network access to unpkg.com.</p></main>';
    } else {
      initCMS({ config });
    }
  </script>
</body>
</html>
